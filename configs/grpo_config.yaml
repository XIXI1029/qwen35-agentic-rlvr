# =====================================================================
# grpo_config.yaml —— Phase 4「GRPO 强化学习」全部配置（本项目核心）
#
# 【run_grpo.py 的读取约定】
#   - training 段   -> 传给 trl.GRPOConfig（字段名与其同名参数一致）
#   - generation 段 -> 采样用超参，脚本会写入 model.generation_config
#                      或作为采样 kwargs（GRPO 是"模型自己采样轨迹"，
#                      采样分布由这里的 temperature/top_p 决定）
#   - reward 段     -> 奖励函数配置（reward_fn 读它决定怎么打分）
#   - data / model / qlora 段与 sft_config 含义一致（这里加载 SFT 后的模型继续训）
#
# 【GRPO 直觉（写简历/面试必答）】
#   对同一个问题(prompt)采样 N 条不同答案(completions) 组成一组(group)，
#   每条奖励先减去组均值再除以组标准差 -> 组内相对优势 A。
#   优势>0 的轨迹（比同组其他答案更好）概率上调，优势<0 的调低。
#   因为没有 Critic 网络来估计状态价值，所以比 PPO 省一半显存/算力，
#   代价是只能比较"同一问题的不同答案"，跨问题不可比 -> 这就是 group 的含义。
#   KL(π_θ || π_ref) 惩罚项防止策略跑太远/崩坏。
# =====================================================================

# ---------- GRPO 训练超参（字段名 = trl 1.12 GRPOConfig）----------
training:
  output_dir: "./outputs/qwen3.5-4b-grpo"   # 训练产物目录
  # ---- 采样规模：GRPO 的显存大头是"每 prompt 展开 N 条轨迹"----
  num_generations: 4        # 每组采样 4 条轨迹（GRPO 的 group size）
                            # ⚠️ 12GB 卡上若 OOM，先降到 2
  max_completion_length: 256   # 每条生成轨迹的最长 token（GSM8K CoT 不长，给 256 够）
  per_device_train_batch_size: 1  # 每卡每步的 prompt 数（1×4 条轨迹 已是 12GB 预算内）
  gradient_accumulation_steps: 8   # 累积 8 次再更新（等效放大 batch，RL 稳定性）
  gradient_checkpointing: true     # 用算力换显存：反传重算中间激活
  num_train_epochs: 10             # 保险给大，实际由 max_steps 封顶
  max_steps: 80                    # ⚠️ 默认封顶 80 步（控制预算；脚本可用 --max-steps 覆盖）
  # ---- 学习率：RL 比 SFT 更敏感，必须更小 ----
  learning_rate: 1.0e-6            # GRPO 常用 1e-6~3e-6；崩了就降到 5e-7
  lr_scheduler_type: "constant"    # RL 常用恒定 lr
  optim: "adamw_torch"
  # ---- GRPO 特有稳定性参数 ----
  beta: 0.04         # KL 惩罚系数。越大越"不敢离开初始策略"；崩了先加 beta
  # ---- 保存 / 日志 ----
  save_strategy: "no"              # RL 短训不存中间 ckpt
  logging_steps: 1                 # 每步打日志，盯 reward/kl 曲线
  report_to: "none"
  # ---- 精度 / 推理引擎 ----
  bf16: true
  use_vllm: false                  # vLLM 加速采样仅限 Linux；Windows 用 torch 采样

# ---------- 采样超参（写入 generation_config / 采样 kwargs）----------
generation:
  temperature: 0.9     # 采样温度：RL 需要"探索"，>1 更随机、<1 更贪心。0.9 平衡探索/利用
  top_p: 0.95          # nucleus 采样：只从累计概率前 95% 的 token 里采
  do_sample: true      # 必须开采样，否则同一 prompt 每次生成一样，GRPO 组内退化
  # repetition_penalty: 1.1   # 若生成疯狂重复再开（一般不需要）

# ---------- 奖励函数配置（reward_fn 读取；RLVR = 可验证奖励）----------
reward:
  # 各奖励项及其权重。GRPO 里总奖励 = Σ(权重_i × 项_i)
  weights:
    # 1) 答案正确性：能否执行并验证出正确答案。最高权重。
    answer_correct: 1.0
    # 2) 格式/工具调用规范性：是否按要求输出 tool_call / final answer 标记。
    #    给一点软奖励，引导模型"说人话、规范调工具"。
    format_correct: 0.1
    # 3) 长度/效率惩罚：鼓励简洁、少绕弯子（与"轨迹效率过滤"呼应）。
    #    负系数：token 越长扣越多（这里按每超 1 token 扣 0.0001，很轻微）。
    length_penalty: -0.0001
  # 代码类题目的运行环境：装了多少编程题运行沙箱（进程内执行，见 run_grpo.py）
  sandbox:
    timeout_seconds: 5     # 每段代码执行超时，防死循环
    max_steps: 12          # 一条轨迹最多允许的工具调用轮数

# ---------- 加载哪个模型来继续 RL ----------
model:
  # GRPO 起点 = SFT 输出。注意 ref_model（KL 锚点）默认自动取"未更新的模型"，
  # 因此必须显式加载 base_model_ref（SFT 权重）固定住，用来算 KL。
  sft_model_dir: "./outputs/qwen3.5-4b-sft"   # 待继续训练的权重（SFT 产物）
  base_model_id: "Qwen/Qwen3.5-4B-Base"       # 若 sft_model_dir 不存在时的兜底基座
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  torch_dtype: "bfloat16"

# ---------- QLoRA（SFT 阶段的适配器直接复用 / 或在此重新挂）----------
qlora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0      # RL 阶段通常把 dropout 设 0，减少噪声
  bias: "none"
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  task_type: "CAUSAL_LM"

# ---------- 数据（GRPO 用 RL 轨迹，非 SFT 数据）----------
data:
  rl_jsonl: "./data/processed/rl.jsonl"   # prepare_data.py 过滤+格式化后的 RL 训练集

# ---------- 输出 ----------
output:
  save_dir: "./outputs/qwen3.5-4b-grpo"   # 最终 GRPO 模型（挂上可继续评估）
